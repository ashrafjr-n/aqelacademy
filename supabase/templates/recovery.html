<!doctype html>
<html lang="ar" dir="rtl">
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:Tahoma,Arial,sans-serif;color:#162648;">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;text-align:right;">
      <p style="margin:0 0 24px;font-size:14px;color:#555555;">أكاديمية الدكتور موفق عقل</p>
      <h1 style="margin:0 0 16px;font-size:22px;">إعادة تعيين كلمة المرور</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.8;color:#555555;">طلبت تعيين كلمة مرور جديدة لحسابك. أدخل هذا الرمز في صفحة «نسيت كلمة المرور» للمتابعة. الرمز صالح لمدة ساعة واحدة.</p>
      <p style="margin:0 0 24px;text-align:center;"><span dir="ltr" style="display:inline-block;background:#f5f6fa;border-radius:12px;padding:14px 28px;font-size:32px;font-weight:bold;letter-spacing:8px;color:#162648;">{{ .Token }}</span></p>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.8;color:#555555;">أو تابع مباشرة من <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="color:#c2410c;font-weight:bold;">هذا الرابط</a>.</p>
      <p style="margin:0;font-size:13px;line-height:1.8;color:#888888;">إذا لم تطلب ذلك، تجاهل هذه الرسالة وستبقى كلمة مرورك كما هي.</p>
    </div>
  </body>
</html>
