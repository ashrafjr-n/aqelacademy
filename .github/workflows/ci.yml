name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Database security tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          npm run test:db
