name: Keep database awake

# The free Supabase project pauses after 7 days without database activity.
# One request a day to the site's health endpoint runs a tiny query.
# UptimeRobot pings the same endpoint every few minutes (see docs/operations.md → Keep-alive); this is the backup.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # GitHub turns off schedules in a public repo after 60 days without commits, which would also
      # stop the daily backup. Re-enabling the workflows every day resets that clock.
      - name: Keep the scheduled workflows on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in keep-alive.yml backup.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done

      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 30 https://aqelacademy.com/api/health
