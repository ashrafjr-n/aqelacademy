name: Keep database awake

# The free Supabase project pauses after 7 days without database activity.
# One request a day to the site's health endpoint runs a tiny query. No secrets needed.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 30 https://aqelacademy.com/api/health
